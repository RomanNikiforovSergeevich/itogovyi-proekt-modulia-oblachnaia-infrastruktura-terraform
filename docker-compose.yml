version: '3.8'

services:
  app:
    image: cr.yandex/${REGISTRY_ID}/app:latest
    container_name: fastapi-app
    restart: unless-stopped
    ports:
      - "80:8000"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
